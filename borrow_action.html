<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Library Management System</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <h2><img class="icon" src="asset/librarymain.png" style="width: 80px; height: 80px;"></h2>
      <ul>
        <a href="main.html"><li>Dashboard</li></a>
        <a href="books.html"><li>Books</li></a>
        <a href="user.html"><li class="nav-item" >Members</li></a>
       <a href="borrow.html"><li class="active" >Borrow</li></a> 
        <li>Return</li>
        <li>Transactions</li>
        <li>Settings</li>
      </ul>
    </aside>

    <div class="borrow-container">
    <h2>📚 Borrow a Book</h2>

    <div class="search-bar">
      <input type="text" placeholder="Search by title, author, or ISBN..." />
      <button>Search</button>
    </div>

    <div class="book-results">
      <div class="book-card available">
        <h3>The Great Gatsby</h3>
        <p>Author: F. Scott Fitzgerald</p>
        <p class="status">Status: Available</p>
        <button class="borrow-btn">Borrow</button>
      </div>

      <div class="book-card unavailable">
        <h3>1984</h3>
        <p>Author: George Orwell</p>
        <p class="status">Status: Unavailable</p>
        <button class="borrow-btn" disabled>Not Available</button>
      </div>
    </div>
  </div>



    

  <script src="borrow_action.js"></script>
</body>
</html>
