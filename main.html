<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Library Management System</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <h2><img class="icon" src="asset/librarymain.png" style="width: 80px; height: 80px;"></h2>
      <ul>
        <a href="main.html"><li class="active">Dashboard</li></a>
        <a href="books.html"><li>Books</li></a>
        <a href="user.html"><li class="nav-item">Members</li></a>
       <a href="borrow.html"><li>Borrow</li></a> 
        <li>Return</li>
        <li>Transactions</li>
        <li>Settings</li>
      </ul>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>Welcome to the Library!</h1>
        <button class="logout-btn" onclick="window.location.href='index.html'">Logout</button>
        <img class="profile-pic" src="asset/profile-user.png" style="width: 40px; height: 40px;" onclick="window.location.href='admin-profile.html'">
      </header>

      <section class="cards">
        <div class="card" style="background-color: #FFD166;">
          <h3>Total Books</h3>
          <p id="totalBooks">Loading...</p>
        </div>
        <div class="card" style="background-color: #06D6A0;">
          <h3>Members</h3>
          <p id="members">Loading...</p>
        </div>
        <div class="card" style="background-color: #EF476F;">
          <h3>Borrowed Today</h3>
          <p id="borrowedToday">Loading...</p>
        </div>
        <div class="card" style="background-color: #118AB2;">
          <h3>Returned</h3>
          <p id="returned">Loading...</p>
        </div>
        <div class="chart-card">
  <h2>Library Activity Overview</h2>
  <canvas id="dashboardChart" width="600" height="300"></canvas>
</div>

<div class="card" style="background-color: #f7b801;">
  <h3>Most Popular Books</h3>
  <ul id="mostPopularBooks">
    <li>Loading...</li>
  </ul>
</div>
      </section>
    </main>
  </div>

  <!-- Link to separate JavaScript file -->
   <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="main.js"></script>
</body>
</html>
