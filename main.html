<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Library Management System</title>
  <link rel="stylesheet" href="css/output.css">
</head>
<body class="m-0 font-sans bg-gray-50">
  <div class="flex h-screen">
    <aside class="w-56 bg-slate-800 text-white p-4 flex flex-col">
      <h2 class="text-center mb-8"><img class="w-20 h-20 mx-auto" src="asset/librarymain.png"></h2>
      <ul class="list-none p-0">
        <a href="main.html" class="text-white no-underline"><li class="p-3 rounded-md mb-2 cursor-pointer transition-colors duration-300 bg-cyan-600">Dashboard</li></a>
        <a href="books.html" class="text-white no-underline"><li class="p-3 rounded-md mb-2 cursor-pointer transition-colors duration-300 hover:bg-cyan-600">Books</li></a>
        <a href="user.html" class="text-white no-underline"><li class="p-3 rounded-md mb-2 cursor-pointer transition-colors duration-300 hover:bg-cyan-600">Members</li></a>
       <a href="borrow.html" class="text-white no-underline"><li class="p-3 rounded-md mb-2 cursor-pointer transition-colors duration-300 hover:bg-cyan-600">Borrow</li></a> 
        <li class="p-3 rounded-md mb-2 cursor-pointer transition-colors duration-300 hover:bg-cyan-600">Return</li>
        <li class="p-3 rounded-md mb-2 cursor-pointer transition-colors duration-300 hover:bg-cyan-600">Transactions</li>
        <li class="p-3 rounded-md mb-2 cursor-pointer transition-colors duration-300 hover:bg-cyan-600">Settings</li>
      </ul>
    </aside>

    <main class="flex-1 p-8 flex flex-col">
      <header class="flex justify-between items-center p-4">
  <h1 class="text-2xl font-bold text-gray-800">Welcome to the Library!</h1>

  <div class="flex items-center gap-4">
    <button class="px-4 py-2 bg-red-500 text-white border-none rounded-md font-bold cursor-pointer hover:bg-red-600 transition-colors duration-200" onclick="window.location.href='index.html'">Logout</button>
    <img class="w-10 h-10 cursor-pointer rounded-full" src="asset/profile-user.png" onclick="window.location.href='admin-profile.html'">
  </div>
</header>


      <section class="grid grid-cols-2 gap-6 mt-8">
        <div class="text-white p-6 rounded-lg shadow-lg bg-yellow-400">
          <h3 class="m-0 mb-4 text-lg font-semibold">Total Books</h3>
          <p id="totalBooks" class="text-xl">Loading...</p>
        </div>
        <div class="text-white p-6 rounded-lg shadow-lg bg-green-400">
          <h3 class="m-0 mb-4 text-lg font-semibold">Members</h3>
          <p id="members" class="text-xl">Loading...</p>
        </div>
        <div class="text-white p-6 rounded-lg shadow-lg bg-red-500">
          <h3 class="m-0 mb-4 text-lg font-semibold">Borrowed Today</h3>
          <p id="borrowedToday" class="text-xl">Loading...</p>
        </div>
        <div class="text-white p-6 rounded-lg shadow-lg bg-cyan-600">
          <h3 class="m-0 mb-4 text-lg font-semibold">Returned</h3>
          <p id="returned" class="text-xl">Loading...</p>
        </div>
        <div class="col-span-2 bg-white p-8 rounded-2xl shadow-lg max-w-full box-border">
  <h2 class="text-xl lg:text-2xl font-bold mb-4 text-gray-800 text-center">Library Activity Overview</h2>
  <canvas id="dashboardChart" width="600" height="300" class="block w-full max-w-full mx-auto" style="height: 100px !important; max-height: 100px !important;"></canvas>
</div>

<div class="text-white p-6 rounded-lg shadow-lg bg-yellow-500">
  <h3 class="m-0 mb-4 text-lg font-semibold">Most Popular Books</h3>
  <ul id="mostPopularBooks" class="list-none p-0">
    <li>Loading...</li>
  </ul>
</div>
      </section>
    </main>
  </div>

  <!-- Link to separate JavaScript file -->
   <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="main.js"></script>
</body>
</html>
