<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Library Management System</title>
  <link rel="stylesheet" href="css/output.css">
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
</head>
<body class="m-0 font-sans bg-gray-50">
  <div class="flex min-h-screen">
    <aside class="fixed z-10 flex flex-col w-64 min-h-screen p-4 text-white transition-all duration-300 lg:w-56 md:w-48 sm:w-16 bg-slate-800 md:relative">
      <h2 class="mb-8 text-center"><img class="w-20 h-20 mx-auto" src="asset/librarymain.png"></h2>
      <ul class="p-0 list-none">
        <a href="main.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer hover:bg-cyan-600">Dashboard</li></a>
        <a href="books.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer hover:bg-cyan-600">Books</li></a>
        <a href="user.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer hover:bg-cyan-600">Members</li></a>
       <a href="borrow.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer hover:bg-cyan-600">Borrow</li></a> 
        <a href="return.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer hover:bg-cyan-600">Return</li></a>
        <a href="transactions.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer hover:bg-cyan-600">Transactions</li></a>
        <a href="settings.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer bg-cyan-600">Settings</li></a>
      </ul>
    </aside>

    <!-- Main Content -->
     <div class="flex flex-col flex-1 min-h-0 p-8 m-8 overflow-y-auto bg-white shadow-lg rounded-xl">
      <h2 class="flex items-center gap-2 mb-8 text-2xl font-bold text-gray-800">
        <img src="asset/setting.png" class="w-10 h-10"> Settings
      </h2>
      
      <div class="w-full p-4 mt-4 border rounded-lg shadow-md bg-gray-50">
        <h2 class="mb-2 text-lg font-semibold">Delete User</h2>
        <form id="userDeletionForm" class="space-y-4">
          <input type="tel" id="deleteUserPhone" name="deleteUserPhone" placeholder="Phone Number" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500" required>
          <button type="submit" class="w-full p-3 text-white transition-colors duration-200 bg-red-600 rounded-md cursor-pointer hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">Delete User</button>
        </form>
      </div>
      <div class="w-full p-4 mt-4 border rounded-lg shadow-md bg-gray-50">
        <h2 class="mb-2 text-lg font-semibold">Update Users</h2>
        <form id="userUpdateForm" class="space-y-4">
          <input type="tel" id="updateUserPhone" name="updateUserPhone" placeholder="Phone Number" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
          <input type="text" id="updateUserName" name="updateUserName" placeholder="New Name" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
          <input type="email" id="updateUserEmail" name="updateUserEmail" placeholder="New Email" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
          <button type="submit" class="w-full p-3 text-white transition-colors duration-200 bg-blue-600 rounded-md cursor-pointer hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">Update User</button>
        </form>
      </div>
      <div class="w-full p-4 mt-4 border rounded-lg shadow-md bg-gray-50">
        <h2 class="mb-2 text-lg font-semibold">Delete Book</h2>
        <form id="bookDeletionForm" class="space-y-4">
          <input type="text" id="deleteBookISBN" name="deleteBookISBN" placeholder="ISBN Number" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500" required>
          <button type="submit" class="w-full p-3 text-white transition-colors duration-200 bg-red-600 rounded-md cursor-pointer hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">Delete Book</button>
        </form>
      </div>
      <div class="w-full p-4 mt-4 border rounded-lg shadow-md bg-gray-50">
        <h2 class="mb-2 text-lg font-semibold">Admin Update</h2>
        <form id="adminUpdateForm" class="space-y-4">
          <input type="text" id="adminUsername" name="adminUsername" placeholder="Username" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
          <input type="email" id="adminEmail" name="adminEmail" placeholder="Email" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
          <input type="password" id="adminPassword" name="adminPassword" placeholder="Password" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
          <input type="password" id="adminConfirmPassword" name="adminConfirmPassword" placeholder="Confirm Password" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
          <button type="submit" class="w-full p-3 text-white transition-colors duration-200 bg-blue-600 rounded-md cursor-pointer hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">Update Admin</button>
        </form>
      </div>
      

     </div>
    
  </div>

  <script src="settings.js"></script>
</body>
</html>
