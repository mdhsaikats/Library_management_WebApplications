<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In or Registration</title>
  <link rel="stylesheet" href="css/output.css">
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
</head>
<body class="bg-gray-100 font-sans flex justify-center items-center min-h-screen m-0">
  <div class="bg-white p-8 rounded-lg shadow-lg w-96">
    <div class="relative">
      <!-- Sign In Form -->
      <form id="signin" class="flex flex-col active">
  <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Sign In</h1>
  <div class="mb-4">
    <label for="signin-username" class="block mb-2 text-sm font-medium text-gray-700">Username</label>
    <input type="text" id="signin-username" name="username" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
  </div>
  <div class="mb-6">
    <label for="signin-password" class="block mb-2 text-sm font-medium text-gray-700">Password</label>
    <input type="password" id="signin-password" name="password" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
  </div>
  <button type="submit" class="w-full py-3 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors duration-200 font-medium">Sign In</button>
          <p class="mt-4 text-center text-sm text-gray-600">Don't have an account? <span id="switch-to-register" class="text-blue-600 cursor-pointer font-semibold hover:text-blue-800">Register</span></p>

</form>


      <!-- Registration Form -->
      <form id="register" class="flex-col hidden">
        <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Register</h1>
        <div class="mb-4">
          <label for="name" class="block mb-2 text-sm font-medium text-gray-700">Full Name</label>
          <input type="text" id="name" name="name" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
        <div class="mb-4">
          <label for="register-email" class="block mb-2 text-sm font-medium text-gray-700">Email</label>
          <input type="email" id="register-email" name="email" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
        <div class="mb-4">
          <label for="register-position" class="block mb-2 text-sm font-medium text-gray-700">Position</label>
          <input type="text" id="register-position" name="Position" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
        <div class="mb-4">
          <label for="register-age" class="block mb-2 text-sm font-medium text-gray-700">Age</label>
          <input type="text" id="register-age" name="age" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
        <div class="mb-4">
          <label for="register-username" class="block mb-2 text-sm font-medium text-gray-700">Username</label>
          <input type="username" id="register-username" name="username" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
        <div class="mb-4">
          <label for="register-password" class="block mb-2 text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="register-password" name="password" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
        <div class="mb-6">
          <label for="confirm-password" class="block mb-2 text-sm font-medium text-gray-700">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirmPassword" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
        
        <button type="submit" class="w-full py-3 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors duration-200 font-medium">Register</button>
        <p class="mt-4 text-center text-sm text-gray-600">Already have an account? <span id="switch-to-signin" class="text-blue-600 cursor-pointer font-semibold hover:text-blue-800">Sign In</span></p>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
