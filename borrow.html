<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Library Management System</title>
  <link rel="stylesheet" href="css/output.css">
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
</head>
<body class="m-0 font-sans bg-gray-50">
  <div class="flex h-screen">
    <aside class="flex flex-col w-56 p-4 text-white bg-slate-800">
      <h2 class="mb-8 text-center"><img class="w-20 h-20 mx-auto" src="asset/librarymain.png"></h2>
      <ul class="p-0 list-none">
        <a href="main.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer hover:bg-cyan-600">Dashboard</li></a>
        <a href="books.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer hover:bg-cyan-600">Books</li></a>
        <a href="user.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer hover:bg-cyan-600">Members</li></a>
       <a href="borrow.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer bg-cyan-600">Borrow</li></a> 
        <a href="return.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer hover:bg-cyan-600">Return</li></a>
        <a href="transactions.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer hover:bg-cyan-600">Transactions</li></a>
        <a href="settings.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer hover:bg-cyan-600">Settings</li></a>
      </ul>
    </aside>
    <div class="flex items-center justify-center flex-1 bg-gradient-to-br from-cyan-50 to-gray-100">
      <div class="flex flex-col items-center w-full max-w-lg p-8 m-8 bg-white border border-gray-200 shadow-2xl rounded-2xl">
        <form id="userSearchForm" class="w-full" autocomplete="off" aria-label="User Search Form">
          <label for="phone" class="block mb-2 text-base font-medium text-gray-700">User Phone Number</label>
          <div class="flex gap-2">
            <input type="text" id="phone" name="phone" required placeholder="Enter user phone number" class="flex-1 px-4 py-3 text-gray-800 placeholder-gray-400 transition-all duration-200 border border-gray-300 shadow-sm rounded-2xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent focus:bg-white" aria-label="User phone number">
            <button type="submit" class="flex items-center gap-2 px-5 py-3 font-semibold text-white transition-all duration-200 border-none shadow-md rounded-2xl bg-cyan-600 hover:bg-cyan-700 focus:ring-2 focus:ring-cyan-400 focus:outline-none" aria-label="Search">
              <span aria-hidden="true">🔍</span> <span class="hidden sm:inline">Search</span>
            </button>
          </div>
          <div id="userSearchMsg" class="mt-3 text-sm text-red-500 min-h-5"></div>
        </form>
        <div id="user-info" class="hidden w-full p-4 mt-6 text-gray-700 border shadow-sm bg-cyan-50 border-cyan-200 rounded-xl">
          <div class="flex items-center gap-3 mb-2">
            <img src="asset/profile-user.png" alt="User" class="w-10 h-10 border rounded-full border-cyan-300">
            <span class="text-lg font-bold" id="user-name"></span>
          </div>
          <div class="text-sm"><span class="font-medium">Email:</span> <span id="user-email"></span></div>
          <div class="text-sm"><span class="font-medium">Phone:</span> <span id="user-phone"></span></div>
        </div>
      </div>
    </div>
  </div>

  <script src="borrow.js"></script>
</body>
</html>
