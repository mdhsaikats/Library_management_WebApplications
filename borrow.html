<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Library Management System</title>
  <link rel="stylesheet" href="css/output.css">
</head>
<body class="m-0 font-sans bg-gray-50">
  <div class="flex h-screen">
    <aside class="w-56 bg-slate-800 text-white p-4 flex flex-col">
      <h2 class="text-center mb-8"><img class="w-20 h-20 mx-auto" src="asset/librarymain.png"></h2>
      <ul class="list-none p-0">
        <a href="main.html" class="text-white no-underline"><li class="p-3 rounded-md mb-2 cursor-pointer transition-colors duration-300 hover:bg-cyan-600">Dashboard</li></a>
        <a href="books.html" class="text-white no-underline"><li class="p-3 rounded-md mb-2 cursor-pointer transition-colors duration-300 hover:bg-cyan-600">Books</li></a>
        <a href="user.html" class="text-white no-underline"><li class="p-3 rounded-md mb-2 cursor-pointer transition-colors duration-300 hover:bg-cyan-600">Members</li></a>
       <a href="borrow.html" class="text-white no-underline"><li class="p-3 rounded-md mb-2 cursor-pointer transition-colors duration-300 bg-cyan-600">Borrow</li></a> 
        <li class="p-3 rounded-md mb-2 cursor-pointer transition-colors duration-300 hover:bg-cyan-600">Return</li>
        <li class="p-3 rounded-md mb-2 cursor-pointer transition-colors duration-300 hover:bg-cyan-600">Transactions</li>
        <li class="p-3 rounded-md mb-2 cursor-pointer transition-colors duration-300 hover:bg-cyan-600">Settings</li>
      </ul>
    </aside>
    <div class="flex-1 flex justify-center items-center bg-gradient-to-br from-cyan-50 to-gray-100">
      <div class="w-full max-w-lg bg-white m-8 rounded-2xl p-8 shadow-2xl border border-gray-200 flex flex-col items-center">
        <form id="userSearchForm" class="w-full" autocomplete="off" aria-label="User Search Form">
          <label for="phone" class="block mb-2 text-base font-medium text-gray-700">User Phone Number</label>
          <div class="flex gap-2">
            <input type="text" id="phone" name="phone" required placeholder="Enter user phone number" class="flex-1 px-4 py-3 rounded-2xl border border-gray-300 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent focus:bg-white transition-all duration-200 text-gray-800 placeholder-gray-400 shadow-sm" aria-label="User phone number">
            <button type="submit" class="px-5 py-3 rounded-2xl border-none bg-cyan-600 text-white hover:bg-cyan-700 focus:ring-2 focus:ring-cyan-400 transition-all duration-200 font-semibold flex items-center gap-2 shadow-md focus:outline-none" aria-label="Search">
              <span aria-hidden="true">🔍</span> <span class="hidden sm:inline">Search</span>
            </button>
          </div>
          <div id="userSearchMsg" class="mt-3 text-red-500 text-sm min-h-5"></div>
        </form>
        <div id="user-info" class="w-full mt-6 hidden bg-cyan-50 border border-cyan-200 rounded-xl p-4 text-gray-700 shadow-sm">
          <div class="flex items-center gap-3 mb-2">
            <img src="asset/profile-user.png" alt="User" class="w-10 h-10 rounded-full border border-cyan-300">
            <span class="font-bold text-lg" id="user-name"></span>
          </div>
          <div class="text-sm"><span class="font-medium">Email:</span> <span id="user-email"></span></div>
          <div class="text-sm"><span class="font-medium">Phone:</span> <span id="user-phone"></span></div>
        </div>
      </div>
    </div>
  </div>

  <script src="borrow.js"></script>
</body>
</html>
