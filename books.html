<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Library Management System</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <h2><img class="icon" src="asset/librarymain.png" style="width: 80px; height: 80px;"></h2>
      <ul>
        <a href="main.html"><li>Dashboard</li></a>
        <a href="books.html"><li class="active">Books</li></a>
        <a href="user.html"><li class="nav-item">Members</li></a>
        <li>Borrow</li>
        <li>Return</li>
        <li>Transactions</li>
        <li>Settings</li>
      </ul>
    </aside>
    <section class="book-add-section">
  <h2><img class="icon" src="asset/library.png"> Add Book</h2>
  <form class="book-add-form">
    <div class="book-add-group">
      <label for="add-title">Title</label>
      <input type="text" id="add-title" name="title" placeholder="Book title" required>
    </div>
    <div class="book-add-group">
      <label for="add-author">Author</label>
      <input type="text" id="add-author" name="author" placeholder="Author name" required>
    </div>
    <div class="book-add-group">
      <label for="add-genre">Genre</label>
      <input type="text" id="add-genre" name="genre" placeholder="e.g. Fiction, History" required>
    </div>
    <div class="book-add-group">
      <label for="add-status">Status</label>
      <select id="add-status" name="status" required>
        <option value="">Select</option>
        <option value="Available">Available</option>
        <option value="Issued">Issued</option>
      </select>
    </div>
    <button type="submit" class="book-add-button">Add Book</button>
  </form>
</section>

    <section id="books-section" class="section">
  <h2><img class="icon" src="asset/books.png">  Books List</h2>
  <table class="styled-table">
    <thead>
      <tr>
        <th>Title</th><th>Author</th><th>Genre</th><th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>Atomic Habits</td><td>James Clear</td><td>Self-help</td><td>Available</td></tr>
      <tr><td>The Alchemist</td><td>Paulo Coelho</td><td>Fiction</td><td>Issued</td></tr>
    </tbody>
  </table>
</section>


    </div>  
</body>
