<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Books - Library Management System</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <div class="container">

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <h2><img class="icon" src="asset/librarymain.png" style="width: 80px; height: 80px;" alt="Library Logo"></h2>
      <ul>
        <a href="main.html"><li>Dashboard</li></a>
        <a href="books.html"><li class="active">Books</li></a>
        <a href="user.html"><li>Members</li></a>
        <a href="borrow.html"><li>Borrow</li></a>
        <li>Return</li>
        <li>Transactions</li>
        <li>Settings</li>
      </ul>
    </aside>

    <!-- Add Book Form -->
    <section class="book-add-section">
      <h2><img class="icon" src="asset/library.png" alt="Add Book Icon"> Add Book</h2>
      <form class="book-add-form">
        <div class="book-add-group">
          <label for="add-title">Title</label>
          <input type="text" id="add-title" name="title" placeholder="Book title" required>
        </div>
        <div class="book-add-group">
          <label for="add-author">Author</label>
          <input type="text" id="add-author" name="author" placeholder="Author name" required>
        </div>
        <div class="book-add-group">
          <label for="add-isbn">ISBN</label>
          <input type="text" id="add-isbn" name="isbn" placeholder="ISBN number" required>
        </div>
        <div class="book-add-group">
          <label for="add-published-year">Published Year</label>
          <input type="number" id="add-published_year" name="published_year" placeholder="Published year" required>
        </div>
        <div class="book-add-group">
          <label for="add-genre">Genre</label>
          <input type="text" id="add-genre" name="genre" placeholder="e.g. Fiction, History" required>
        </div>
        <button type="submit" class="book-add-button">Add Book</button>
      </form>
    </section>

    <!-- Book List Table -->
<main class="content-section" id="books-section">
  <h2 class="section-title">
    <img class="icon" src="asset/books.png" alt="Books Icon"> Books List
  </h2>
  <table class="styled-table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Author</th>
        <th>ISBN</th>
        <th>Published Year</th>
        <th>Genre</th>
      </tr>
    </thead>
    <tbody>
      <!-- Book data will be dynamically inserted here by books.js -->
    </tbody>
  </table>

  </div>

  <!-- JS Script -->
  <script src="books.js"></script>
</body>
</html>
