<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User List - Library Management System</title>
  <link rel="stylesheet" href="css/output.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
</head>
<body class="m-0 font-sans bg-gray-50">
  <div class="flex h-screen">
    
    <!-- Sidebar Navigation -->
    <aside class="flex flex-col w-56 p-4 text-white bg-slate-800">
      <h2 class="mb-8 text-center"><img class="w-20 h-20 mx-auto" src="asset/librarymain.png"></h2>
      <ul class="p-0 list-none">
        <a href="main.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer hover:bg-cyan-600">Dashboard</li></a>
        <a href="books.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer hover:bg-cyan-600">Books</li></a>
        <a href="user.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer bg-cyan-600">Members</li></a>
        <a href="borrow.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer hover:bg-cyan-600">Borrow</li></a>
        <a href="return.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer hover:bg-cyan-600">Return</li></a>
        <a href="transactions.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer hover:bg-cyan-600">Transactions</li></a>
        <a href="settings.html" class="text-white no-underline"><li class="p-3 mb-2 transition-colors duration-300 rounded-md cursor-pointer hover:bg-cyan-600">Settings</li></a>
      </ul>
    </aside>

    <!-- Add New Member Form -->
    <section class="max-w-lg p-8 m-8 bg-white rounded-lg shadow-lg">
      <h2 class="flex items-center gap-2 mb-6 text-xl font-semibold text-slate-800">
        <img class="w-12 h-12" src="asset/group.png" alt="Group Icon"> Add New Member
      </h2>
      <form class="flex flex-col space-y-4">
        <div class="flex flex-col">
          <label for="full-name" class="mb-2 font-semibold text-gray-700">Full Name</label>
          <input type="text" id="full-name" name="fullName" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" />
        </div>
        <div class="flex flex-col">
          <label for="email" class="mb-2 font-semibold text-gray-700">Email Address</label>
          <input type="email" id="email" name="email" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" />
        </div>
        <div class="flex flex-col">
          <label for="phone" class="mb-2 font-semibold text-gray-700">Phone Number</label>
          <input type="tel" id="phone" name="phone" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" />
        </div>
        <button type="submit" class="px-6 py-3 mt-4 font-bold text-white transition-colors duration-200 bg-green-400 border-none rounded-md cursor-pointer hover:bg-green-500">Add Member</button>
      </form>
    </section>

    <!-- User List Table -->
    <main class="flex-1 p-8 m-8 bg-white rounded-lg shadow-lg" id="users-section">
      <h2 class="flex items-center gap-2 mb-6 text-xl font-semibold text-slate-800">
        <img class="w-12 h-12" src="asset/user.png" alt="User Icon"> User List
      </h2>
      <div class="overflow-x-auto">
        <table class="w-full overflow-hidden text-sm border-collapse rounded-lg min-w-96">
          <thead class="text-left text-white bg-green-400">
            <tr>
              <th class="px-4 py-3">ID</th>
              <th class="px-4 py-3">Name</th>
              <th class="px-4 py-3">Email</th>
              <th class="px-4 py-3">Phone</th>
            </tr>
          </thead>
          <tbody class="text-sm">
            <!-- User data will be dynamically inserted here by user.js -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- JS Script -->
  <script src="user.js"></script>
</body>
</html>
