<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User List - Library Management System</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <div class="library-container">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <h2><img class="icon" src="asset/librarymain.png" style="width: 80px; height: 80px;"></h2>
      <ul>
        <a href="main.html"><li>Dashboard</li></a>
        <a href="books.html"><li>Books</li></a>
        <a href="user.html" ><li class="active">Members</li></a>
        <a href="borrow.html"><li>Borrow</li></a>
        <li>Return</li>
        <li>Transactions</li>
        <li>Settings</li>
      </ul>
    </aside>

    <!-- Add New Member Form -->
    <section class="add-user-section">
      <h2><img class="icon" src="asset/group.png" alt="Group Icon"> Add New Member</h2>
      <form class="user-form">
        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="fullName" required />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" required />
        </div>
        <button type="submit" class="submit-user-btn">Add Member</button>
      </form>
    </section>

    <!-- User List Table -->
    <main class="content-section" id="users-section">
      <h2 class="section-title">
        <img class="icon" src="asset/user.png" alt="User Icon"> User List
      </h2>
      <table class="user-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
          </tr>
        </thead>
        <tbody>
          <!-- User data will be dynamically inserted here by user.js -->
        </tbody>
      </table>
    </main>
  </div>

  <!-- JS Script -->
  <script src="user.js"></script>
</body>
</html>
